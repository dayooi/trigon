<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1b1b1b">
<title>Trigon — Triangle Block Puzzle</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="hud-side">
      <div class="gem-pill">
        <svg class="icon gem" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 3h14l4 6-11 12L1 9z" fill="#e63b4d" />
          <path d="M5 3h14l-7 6z" fill="#ff7a86" />
          <path d="M1 9h22l-11 12z" fill="#c22437" />
        </svg>
        <span id="gems">0</span>
      </div>
    </div>
    <div class="scores">
      <span class="score" id="score">0</span>
      <svg class="icon crown" viewBox="0 0 32 24" aria-hidden="true">
        <path d="M3 21 L1 5 L9 11 L16 1 L23 11 L31 5 L29 21 Z" />
      </svg>
      <span class="best" id="best">0</span>
    </div>
    <div class="hud-side right">
      <button class="pause" id="pause" aria-label="Pause">
        <span></span><span></span>
      </button>
    </div>
  </header>

  <main class="board-wrap">
    <svg id="board" role="img" aria-label="Triangle board"></svg>
  </main>

  <footer class="tray" id="tray"></footer>
</div>

<div id="ghost-layer"></div>
<div id="float-layer"></div>

<div id="overlay" class="overlay">
  <div class="panel">
    <h1 id="overlay-title">Paused</h1>
    <div id="overlay-body" class="stats"></div>
    <div class="actions">
      <button id="resume" class="btn primary">Resume</button>
      <button id="restart" class="btn">New Game</button>
    </div>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
