<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1b1b1b">
<title>Trigon — Triangle Block Puzzle</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="gem-pill">
      <svg class="icon gem" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 3h14l4 6-11 12L1 9z" fill="#e63b4d" />
        <path d="M5 3h14l-7 6z" fill="#ff7a86" />
        <path d="M1 9h22l-11 12z" fill="#c22437" />
      </svg>
      <span id="gems">0</span>
    </div>
    <button class="theme-btn" id="theme-btn" aria-label="Change theme">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path class="palette-body"
              d="M12 2.6c-5.3 0-9.4 3.9-9.4 8.8 0 5 4.2 9 9.4 9 1.7 0 2.7-1 2.7-2.2 0-.6-.2-1-.6-1.4-.3-.4-.5-.7-.5-1.1 0-.8.7-1.4 1.6-1.4h1.2c3 0 5-2 5-4.9 0-4-3.9-6.8-9.4-6.8Z" />
        <circle class="dot dot-1" cx="7.4" cy="12.4" r="1.5" />
        <circle class="dot dot-2" cx="9.4" cy="8.2" r="1.5" />
        <circle class="dot dot-3" cx="14.1" cy="7.6" r="1.5" />
        <circle class="dot dot-4" cx="17.6" cy="10.2" r="1.5" />
      </svg>
    </button>
  </header>

  <main class="stage">
    <div class="scorebar">
      <div class="scores">
        <span class="score" id="score">0</span>
        <svg class="icon crown" viewBox="0 0 32 24" aria-hidden="true">
          <path d="M3 21 L1 5 L9 11 L16 1 L23 11 L31 5 L29 21 Z" />
        </svg>
        <span class="best" id="best">0</span>
      </div>
      <button class="pause" id="pause" aria-label="Pause">
        <span></span><span></span>
      </button>
    </div>
    <div class="board-wrap">
      <svg id="board" role="img" aria-label="Triangle board"></svg>
    </div>
  </main>

  <footer class="tray" id="tray"></footer>
</div>

<div id="ghost-layer"></div>
<div id="float-layer"></div>

<div id="themes" class="theme-page">
  <header class="theme-bar">
    <button class="theme-x" id="theme-close" aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 5 L19 19 M19 5 L5 19" />
      </svg>
    </button>
    <div class="gem-pill">
      <svg class="icon gem" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 3h14l4 6-11 12L1 9z" fill="#e63b4d" />
        <path d="M5 3h14l-7 6z" fill="#ff7a86" />
        <path d="M1 9h22l-11 12z" fill="#c22437" />
      </svg>
      <span id="gems-page">0</span>
    </div>
  </header>
  <div class="theme-list" id="theme-list"></div>
</div>

<div id="confirm" class="overlay">
  <div class="panel">
    <h1>Stuck Piece</h1>
    <div class="confirm-piece" id="confirm-piece"></div>
    <p class="confirm-text" id="confirm-text"></p>
    <div class="actions">
      <button id="confirm-yes" class="btn primary">Reshuffle</button>
      <button id="confirm-no" class="btn">Cancel</button>
    </div>
  </div>
</div>

<div id="draw" class="draw">
  <div class="draw-panel">
    <div class="draw-title">Lucky Draw</div>
    <div class="reel-window">
      <div class="reel" id="reel"></div>
      <div class="reel-marker"></div>
    </div>
    <button class="draw-cta" id="draw-spin">Tap to spin</button>
  </div>
</div>

<div id="overlay" class="overlay">
  <div class="panel">
    <h1 id="overlay-title">Paused</h1>
    <div id="overlay-body" class="stats"></div>
    <div class="actions">
      <button id="resume" class="btn primary">Resume</button>
      <button id="restart" class="btn">New Game</button>
    </div>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
